name: Deploy ywl image

on:
  push:
    branches: [deploy/ywl-3.29.1]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/molaison/cpr-ywl
    steps:
      - uses: actions/checkout@v4

      - name: Build time
        id: stamp
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          build-args: |
            CPR_VERSION=3.29.1
            CPR_GIT_SHA=743a3aba70a4f78f27fb53d80a6e719599d2fe5e
            CPR_BUILD_TYPE=ywl-deploy-20261026
            CPR_BUILD_TIME=${{ steps.stamp.outputs.value }}
          tags: |
            ${{ env.IMAGE }}:3.29.1-ywl
            ${{ env.IMAGE }}:3.29.1-${{ github.sha }}
